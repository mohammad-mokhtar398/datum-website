      '<span class="mono v" dir="ltr" style="text-align:start">+974 4441 0210</span>' +
      '<span class="mono v" dir="ltr" style="text-align:start">+974 3302 2201</span>' +
      '<span class="mono v" dir="ltr" style="text-align:start">+974 3131 3064 · WhatsApp</span></div>' +
      '<div class="g"><span class="lb">' + esc(L.lblMail) + '</span><span class="mono v" dir="ltr" style="text-align:start">info@datum.qa</span></div>' +
      '<div class="g"><span class="lb">' + esc(L.lblInsta) + '</span><a class="l mono v" href="' + IG + '" target="_blank" rel="noopener" dir="ltr" style="text-align:start">@datum.qa</a></div>' +
      '<div class="g"><span class="lb">' + esc(L.lblAddr) + '</span><span class="v">' + esc(L.address) + '</span><a class="l" href="' + MAP + '" target="_blank" rel="noopener">' + esc(L.map) + '</a></div>' +
      '<div class="g"><span class="lb">' + esc(L.lblHours) + '</span><span class="v">' + esc(L.hoursLong) + '</span></div></div></div></section></main>' +

      '<footer><div class="wrap"><span>' + esc(L.rights) + '</span><span><a href="' + IG + '" target="_blank" rel="noopener">Instagram</a></span></div></footer>' +
      '<a class="wa" href="' + gen + '" target="_blank" rel="noopener" aria-label="' + esc(L.waLabel) + '"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.1-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 .9-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg></a>';
  }

  function chosen(L) {
    var out = [];
    IDS.forEach(function (id, i) { if (state.sel.indexOf(id) >= 0) out.push({ id: id, name: L.sys[i][0] }); });
    return out;
  }

  function update() {
    var L = T[state.lang];
    var ch = chosen(L);
    var counts = document.querySelectorAll('[data-nav-count]');
    for (var k = 0; k < counts.length; k++) counts[k].textContent = ch.length;
    IDS.forEach(function (id) {
      var b = document.getElementById('b-' + id);
      if (!b) return;
      var on = state.sel.indexOf(id) >= 0;
      b.textContent = on ? L.added : L.add;
      b.className = 'addbtn' + (on ? ' on' : '');
    });
  }

  function addAndGo(id) {
    if (state.sel.indexOf(id) < 0) state.sel.push(id);
    try { localStorage.setItem('datum-quote', JSON.stringify(state.sel)); } catch (e) {}
    location.href = 'quote.html?add=' + encodeURIComponent(id);
  }

  function reveal() {
    var els = document.querySelectorAll('.rv');
    if (!('IntersectionObserver' in window)) { for (var i = 0; i < els.length; i++) els[i].classList.add('in'); return; }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    for (var j = 0; j < els.length; j++) io.observe(els[j]);
  }

  function bind() {
    document.getElementById('langBtn').addEventListener('click', function () {
      state.lang = state.lang === 'en' ? 'ar' : 'en';
      try { localStorage.setItem('datum-lang', state.lang); } catch (e) {}
      render();
      window.scrollTo(0, 0);
    });
    document.getElementById('themeBtn').addEventListener('click', function () {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', state.theme);
      try { localStorage.setItem('datum-theme', state.theme); } catch (e) {}
    });
    var btns = document.querySelectorAll('.addbtn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function (e) { addAndGo(e.currentTarget.getAttribute('data-id')); });
    }
  }

  function render() {
    var L = T[state.lang];
    document.documentElement.lang = state.lang;
    document.documentElement.dir = L.dir;
    document.documentElement.setAttribute('data-theme', state.theme);
    app.innerHTML = tpl(L);
    bind();
    update();
    reveal();
  }

  render();
})();
</script>
