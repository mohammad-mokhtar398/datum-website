<title>Datum Technologies | IT, Networking and Smart Homes in Qatar</title>
<meta name="description" content="Datum Technologies designs, supplies, installs and supports Wi-Fi, networks, CCTV, door stations, IP telephony, home automation and NAS in Qatar.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--blue:#2656A8;--green:#60BA48;--on-green:#08130A;color-scheme:dark}
html[data-theme=dark]{--bg:#0A1220;--bg2:#0E1830;--surface:#111C32;--surface2:#16233D;--line:#223152;--ink:#E8EEF8;--ink2:#A9B7CC;--ink3:#8D9DB6;--link:#7FB0FF;--accent:#60BA48;--glow:rgba(96,186,72,.18);--glow2:rgba(38,86,168,.45);color-scheme:dark}
html[data-theme=light]{--bg:#F5F8FC;--bg2:#EAF0F8;--surface:#FFFFFF;--surface2:#F0F5FB;--line:#D3DEEC;--ink:#0E1B33;--ink2:#41526C;--ink3:#566783;--link:#1F4C99;--accent:#2E7D1F;--glow:rgba(96,186,72,.22);--glow2:rgba(38,86,168,.18);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.6;transition:background .3s,color .3s}
html[lang=ar] body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:17px;line-height:1.75}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.disp,h1,h2,h3{font-family:'Space Grotesk',sans-serif}
html[lang=ar] .disp,html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{font-family:'IBM Plex Sans Arabic',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
h1{margin:0;font-weight:700;font-size:68px;line-height:1.03;letter-spacing:-.035em;text-wrap:balance}
h2{margin:0;font-weight:700;font-size:42px;line-height:1.1;letter-spacing:-.025em;text-wrap:balance}
html[lang=ar] h1{font-size:58px;line-height:1.25;letter-spacing:0}
html[lang=ar] h2{line-height:1.3;letter-spacing:0}
.grad{background:linear-gradient(100deg,var(--green),#4FA3FF 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme=light] .grad{background:linear-gradient(100deg,#2E7D1F,#2656A8 75%);-webkit-background-clip:text;background-clip:text}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:500}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--green)}
html[lang=ar] .eyebrow{font-family:inherit;font-size:15px;letter-spacing:0;text-transform:none;font-weight:600}
.lead{font-size:19px;color:var(--ink2);max-width:560px;margin:0}
/* header */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none!important}
.brand .lg{width:42px;height:42px;border-radius:11px;background:#fff;display:grid;place-items:center;flex:none}
.brand .lg img{width:26px;height:auto;display:block}
.brand b{font-family:'Space Grotesk',sans-serif;font-size:22px;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font-family:'Space Grotesk',sans-serif;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
nav{display:flex;align-items:center;gap:6px}
nav a.l{color:var(--ink2);font-weight:500;font-size:15px;padding:10px 14px;border-radius:8px}
nav a.l:hover{color:var(--ink);background:var(--surface);text-decoration:none}
.tools{display:flex;align-items:center;gap:8px}
.ib{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:44px;min-width:44px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ib:hover{border-color:var(--green)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
html[data-theme=dark] .ic-moon{display:none}
html[data-theme=light] .ic-sun{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:16px;min-height:50px;padding:0 26px;border-radius:12px;border:1.5px solid var(--line);color:var(--ink);background:transparent;cursor:pointer;text-decoration:none!important;transition:transform .2s,border-color .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--green)}
.btn.fill{background:var(--green);border-color:var(--green);color:var(--on-green);box-shadow:0 8px 28px -8px rgba(96,186,72,.55)}
.btn.sm{min-height:44px;padding:0 18px;font-size:15px}
/* hero */
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 55% at 78% 30%,var(--glow2),transparent 70%),radial-gradient(40% 40% at 10% 90%,var(--glow),transparent 70%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.35;-webkit-mask-image:radial-gradient(70% 70% at 60% 40%,#000,transparent);mask-image:radial-gradient(70% 70% at 60% 40%,#000,transparent);pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:48px;padding-top:88px;padding-bottom:88px}
.hero .wrap>div{flex:1 1 460px;min-width:0}
.stack{display:flex;flex-direction:column;gap:28px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.topo{width:100%;height:auto;display:block;direction:ltr}
.topo .ln{stroke:var(--green);stroke-width:1.6;fill:none;stroke-dasharray:5 7;opacity:.75;animation:flow 1.6s linear infinite}
.topo .core{fill:var(--surface);stroke:var(--green);stroke-width:2}
.topo .nd{fill:var(--surface2);stroke:var(--line);stroke-width:1.5}
.topo .pulse{fill:none;stroke:var(--green);stroke-width:1.5;transform-origin:240px 200px;animation:pulse 3s ease-out infinite}
.topo text{font-family:'JetBrains Mono',monospace;font-size:11px;fill:var(--ink2);text-anchor:middle}
.topo .dot{fill:var(--green)}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.1);opacity:0}}
/* facts strip */
.facts{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg2)}
.facts .wrap{display:flex;flex-wrap:wrap}
.fact{flex:1 1 200px;padding:26px 24px;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.fact:first-child{border-inline-start:0;padding-inline-start:0}
.fact b{font-family:'Space Grotesk',sans-serif;font-size:34px;line-height:1.1;letter-spacing:-.02em}
html[lang=ar] .fact b{font-family:'IBM Plex Sans Arabic',sans-serif}
.fact span{color:var(--ink2);font-size:14.5px}
/* sections */
.sec{padding:104px 0}
.sec.alt{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.head{display:flex;flex-direction:column;gap:16px;max-width:680px;margin-bottom:48px}
.head p{margin:0;color:var(--ink2);font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:10px;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);border-color:var(--green);box-shadow:0 18px 40px -22px var(--green)}
.card .ico{width:50px;height:50px;border-radius:13px;background:linear-gradient(140deg,var(--blue),#1B3F80);display:grid;place-items:center;margin-bottom:6px}
.card .ico svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0;font-size:21px;font-weight:600}
.card .d{color:var(--ink2);font-size:15px;flex:1}
.card .b{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent)}
html[lang=ar] .card .b{font-family:inherit;font-size:14px;font-weight:600}
.addbtn{margin-top:10px;align-self:flex-start;font:inherit;font-weight:600;font-size:14px;min-height:44px;padding:0 18px;border-radius:10px;cursor:pointer;background:transparent;color:var(--ink);border:1.5px solid var(--line);transition:all .2s}
.addbtn:hover{border-color:var(--green)}
.addbtn.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
/* process */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.step{padding:32px 28px;display:flex;flex-direction:column;gap:12px;border-inline-end:1px solid var(--line)}
.step:last-child{border-inline-end:0}
.step .no{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);letter-spacing:.08em}
.step h3{margin:0;font-size:22px;font-weight:600}
.step p{margin:0;color:var(--ink2);font-size:15px}
/* portfolio */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.shot{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,#142447,#0C1730);display:flex;align-items:flex-end}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.shot:hover img{transform:scale(1.05)}
.shot .art{position:absolute;inset:0;opacity:.55;background-image:linear-gradient(rgba(96,186,72,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(96,186,72,.25) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(80% 80% at 70% 30%,#000,transparent);mask-image:radial-gradient(80% 80% at 70% 30%,#000,transparent)}
.shot .cap{position:relative;width:100%;padding:44px 20px 18px;background:linear-gradient(transparent,rgba(5,10,20,.9));color:#fff;display:flex;flex-direction:column;gap:2px}
.shot .cap b{font-family:'Space Grotesk',sans-serif;font-size:19px}
html[lang=ar] .shot .cap b{font-family:'IBM Plex Sans Arabic',sans-serif}
.shot .cap span{font-size:13.5px;color:#B7C5DA}
/* brands */
.brands{display:flex;flex-wrap:wrap;gap:14px}
.brand-pill{flex:1 1 220px;display:flex;align-items:center;justify-content:center;min-height:96px;border:1px solid var(--line);border-radius:16px;background:var(--surface);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:30px;letter-spacing:-.02em;color:var(--ink);transition:all .25s;text-decoration:none!important}
.brand-pill:hover{border-color:var(--green);transform:translateY(-3px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:40px}
.tile{padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.tile b{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600}
html[lang=ar] .tile b{font-family:'IBM Plex Sans Arabic',sans-serif}
.tile .br{font-size:13px;color:var(--accent);font-weight:600}
.tile span{font-size:14px;color:var(--ink3)}
/* testimonials */
.tm{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.tm figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:18px}
.tm blockquote{margin:0;font-size:17px;color:var(--ink)}
.tm figcaption{color:var(--ink2);font-size:14.5px}
.tm figcaption b{display:block;color:var(--ink);font-size:16px}
/* quote */
.quote{display:flex;flex-wrap:wrap;gap:48px}
.quote>div{min-width:0}
.q-list{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:8px}
.q-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.q-item b{font-weight:600;font-size:18px}
.q-item button{font:inherit;font-size:14px;font-weight:600;color:var(--link);background:transparent;border:0;padding:10px 4px;min-height:44px;cursor:pointer}
.q-empty{margin:0;padding:18px 0;color:var(--ink3);border-bottom:1px solid var(--line)}
.form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px;display:flex;flex-direction:column;gap:18px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-weight:600;font-size:14px}
.fld input,.fld textarea{font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.fld input:focus,.fld textarea:focus{border-color:var(--green)}
html[dir=rtl] input[dir=ltr]{text-align:right}
.send{display:flex;align-items:center;justify-content:center;min-height:52px;font-weight:600;border-radius:12px;text-decoration:none!important;background:var(--surface2);color:var(--ink3);border:1px solid var(--line)}
.send.ready{background:var(--green);border-color:var(--green);color:var(--on-green);box-shadow:0 8px 28px -8px rgba(96,186,72,.55)}
.small{font-size:14px;color:var(--ink3)}
/* contact */
.contact{position:relative;overflow:hidden;border-radius:24px;padding:64px;display:flex;flex-wrap:wrap;gap:48px;background:linear-gradient(135deg,#17306A,#0B1A3A 60%,#0F2A33);color:#fff;border:1px solid #27407A}
.contact>div{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:24px;position:relative}
.contact h2{font-size:46px}
.contact p{margin:0;color:#C5D3E8;font-size:18px;max-width:460px}
.contact .lb{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8FD07A}
html[lang=ar] .contact .lb{font-family:inherit;font-size:14px;font-weight:600;letter-spacing:0;text-transform:none}
.contact .g{display:flex;flex-direction:column;gap:4px}
.contact .v{font-size:18px}
.contact a.l{color:#8FD07A}
footer{border-top:1px solid var(--line);color:var(--ink3);font-size:14px;margin-top:104px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;padding-top:28px;padding-bottom:28px}
footer a{color:var(--ink3)}
.wa{position:fixed;inset-inline-end:20px;bottom:20px;z-index:40;width:58px;height:58px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 10px 30px -6px rgba(0,0,0,.5);transition:transform .2s}
.wa:hover{transform:scale(1.08)}
.wa svg{width:30px;height:30px;fill:#fff}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
@media (max-width:900px){nav a.l{display:none}.sec{padding:72px 0}}
@media (max-width:720px){
.wrap{padding:0 16px}
h1{font-size:42px}html[lang=ar] h1{font-size:36px}
h2{font-size:32px}
.hero .wrap{padding-top:48px;padding-bottom:56px;gap:32px}
.contact{padding:32px 20px;gap:32px}.contact h2{font-size:34px}
.form{padding:20px}
.fact{flex:1 1 45%;border-inline-start:0;padding:18px 0}
.step{border-inline-end:0;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}
.brand small{display:none}
.tools .btn{display:none}
}
</style>
</head>

  function update() {
    var L = T[state.lang];
    var ch = chosen(L);
    var counts = document.querySelectorAll('[data-nav-count]');
    for (var k = 0; k < counts.length; k++) counts[k].textContent = ch.length;
    IDS.forEach(function (id) {
      var b = document.getElementById('b-' + id);
      if (!b) return;
      var on = state.sel.indexOf(id) >= 0;
      b.textContent = on ? L.added : L.add;
      b.className = 'addbtn' + (on ? ' on' : '');
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var list = document.getElementById('qList');
    if (ch.length === 0) {
      list.innerHTML = '<p class="q-empty">' + esc(L.none) + '</p>';
    } else {
      list.innerHTML = ch.map(function (c) {
        return '<div class="q-item"><b>' + esc(c.name) + '</b><button type="button" data-remove="' + c.id + '" aria-label="' + esc(L.remove + ' ' + c.name) + '">' + esc(L.remove) + '</button></div>';
      }).join('');

    var can = ch.length > 0 && state.name.trim() !== '' && phoneOk;

    if (can) {
      var lines = [L.wHello, '', L.wName + ': ' + state.name.trim(), L.wPhone + ': ' + state.phone.trim()];
      if (state.email.trim() !== '') lines.push(L.wEmail + ': ' + state.email.trim());

      ch.forEach(function (c) { lines.push('- ' + c.name); });
      if (state.note.trim() !== '') lines.push(L.wDetails + ': ' + state.note.trim());
      lines.push('', L.wFrom);

      send.rel = 'noopener';
      send.className = 'send ready';
      send.setAttribute('aria-disabled', 'false');
      missing.style.display = 'none';

      send.href = '#quote';
      send.removeAttribute('target');
      send.className = 'send';
      send.setAttribute('aria-disabled', 'true');
      missing.style.display = '';

  function reveal() {
    var els = document.querySelectorAll('.rv');
    if (!('IntersectionObserver' in window)) { for (var i = 0; i < els.length; i++) els[i].classList.add('in'); return; }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    for (var j = 0; j < els.length; j++) io.observe(els[j]);
  }

    });
    var fields = { 'q-name': 'name', 'q-phone': 'phone', 'q-email': 'email', 'q-note': 'note' };
    Object.keys(fields).forEach(function (id) {
      var el = document.getElementById(id);
      el.value = state[fields[id]];
      el.addEventListener('input', function () { state[fields[id]] = el.value; update(); });

    var btns = document.querySelectorAll('.addbtn');

    }
    document.getElementById('qList').addEventListener('click', function (e) {
      var id = e.target && e.target.getAttribute && e.target.getAttribute('data-remove');
      if (id) toggle(id);
    });
    document.getElementById('send').addEventListener('click', function (e) {
      if (this.getAttribute('aria-disabled') === 'true') {
        e.preventDefault();
        document.getElementById('q-name').focus();
      }
    });
  }

  function render() {
    var L = T[state.lang];
    document.documentElement.lang = state.lang;
    document.documentElement.dir = L.dir;
    document.documentElement.setAttribute('data-theme', state.theme);
    app.innerHTML = tpl(L);
    bind();
    update();
    reveal();
  }

  render();
})();
</script>
</body>
</html>
