<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a quote | Datum Technologies</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
body{min-height:100vh;background:var(--bg)}
.qp{position:relative;overflow:hidden}
.qp::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 0%,var(--glow2),transparent 70%),radial-gradient(40% 40% at 90% 85%,var(--glow),transparent 70%);pointer-events:none}
.qp::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.3;-webkit-mask-image:radial-gradient(70% 55% at 50% 15%,#000,transparent);mask-image:radial-gradient(70% 55% at 50% 15%,#000,transparent);pointer-events:none}
.qp>*{position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px}
.top a.back{color:var(--ink2);font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.top a.back:hover{color:var(--ink);text-decoration:none}
.top a.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html[dir=rtl] .top a.back svg{transform:scaleX(-1)}
.logo{display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 0 8px;text-align:center}
.logo .mk{width:88px;height:88px;border-radius:24px;background:#fff;display:grid;place-items:center;box-shadow:0 20px 50px -18px var(--blue),0 0 0 6px color-mix(in srgb,var(--blue) 25%,transparent)}
.logo .mk img{width:54px;height:auto;display:block}
.logo .nm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1}
.logo .nm small{display:block;font-size:11.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink3);margin-top:8px;font-weight:500}
.ttl{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:28px 0 36px}
.ttl h1{font-size:50px}
html[lang=ar] .ttl h1{font-size:44px}
.ttl p{margin:0;color:var(--ink2);font-size:18px;max-width:600px}
.stp{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;margin-top:6px}
.stp span{display:inline-flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink2);font-weight:500}
.stp b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:var(--on-green);font-family:'JetBrains Mono',monospace;font-size:13px}
.lay{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;padding-bottom:96px}
.lay>.l{flex:1 1 520px;min-width:0}
.lay>.r{flex:1 1 400px;min-width:0;position:sticky;top:24px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px}
.box h2{font-size:24px;margin-bottom:6px}
.box>p{margin:0 0 22px;color:var(--ink2);font-size:15px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.opt{position:relative;text-align:start;font:inherit;color:var(--ink);background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:16px;min-height:96px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,transform .2s,background .2s}
.opt:hover{border-color:var(--green);transform:translateY(-2px)}
.opt .ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(140deg,var(--blue),#1B3F80);display:grid;place-items:center}
.opt .ic svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.opt b{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;line-height:1.25}
html[lang=ar] .opt b{font-family:'IBM Plex Sans Arabic',sans-serif}
.opt small{font-size:12.5px;color:var(--ink3)}
.opt .ck{position:absolute;top:12px;inset-inline-end:12px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:all .2s}
.opt .ck svg{width:14px;height:14px;stroke:var(--on-green);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.opt[aria-pressed=true]{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--bg2))}
.opt[aria-pressed=true] .ck{background:var(--green);border-color:var(--green)}
.opt[aria-pressed=true] .ck svg{opacity:1}
.sel{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px;min-height:36px}
.sel .tag{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--green) 14%,var(--bg2));border:1px solid var(--green);color:var(--ink);border-radius:999px;font:inherit;font-size:14px;font-weight:500;padding:6px 8px 6px 14px;min-height:36px;cursor:pointer}
html[dir=rtl] .sel .tag{padding:6px 14px 6px 8px}
.sel .tag i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink2);font-size:14px;line-height:1}
.sel .none{margin:0;color:var(--ink3);font-size:14.5px;align-self:center}
.form{display:flex;flex-direction:column;gap:16px;background:transparent;border:0;padding:0}
.hint{display:none;margin:0;font-size:14px;color:#E0A83A}
.hint.on{display:block}
.fine{font-size:13.5px;color:var(--ink3);margin:0}
footer{margin-top:0}
@media (max-width:720px){.ttl h1{font-size:34px}html[lang=ar] .ttl h1{font-size:30px}.box{padding:20px}.lay>.r{position:static}.logo .mk{width:76px;height:76px}.logo .mk img{width:46px}.lay{padding-bottom:64px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var WA = '97431313064';
  var IDS = ['wifi', 'network', 'fw', 'cctv', 'door', 'phone', 'home', 'nas', 'car'];
  var ICONS = {
    wifi: 'M2 9a15 15 0 0 1 20 0 M5.5 12.5a10 10 0 0 1 13 0 M9 16a5 5 0 0 1 6 0 M12 19.5h.01',
    network: 'M9 3h6v5H9z M3 16h6v5H3z M15 16h6v5h-6z M12 8v4 M6 16v-4h12v4',
    fw: 'M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z M9 12l2 2 4-4',
    cctv: 'M3 7l12-3 2 7-12 3z M17 8l4-1v5l-3 .8 M9 15v4 M6 19h6',
    door: 'M6 3h12v18H6z M14.5 12h.01 M9 8h3 M9 16h3',
    phone: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z',
    home: 'M3 11l9-8 9 8 M5 10v10h14V10 M10 20v-6h4v6',
    nas: 'M4 5h16v5H4z M4 14h16v5H4z M7.5 7.5h.01 M7.5 16.5h.01',
    car: 'M5 16l1.5-5a2 2 0 0 1 1.9-1.4h7.2a2 2 0 0 1 1.9 1.4L19 16 M3 16h18v3H3z M7 19v1.5 M17 19v1.5 M7.5 17.5h.01 M16.5 17.5h.01'
  };
  function svg(id) { return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + ICONS[id] + '"/></svg>'; }
  var CK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';

  var N = {
    en: { wifi: ['Wi-Fi', 'UniFi'], network: ['Network', 'UniFi'], fw: ['Firewall', 'Netgate and UniFi'], cctv: ['CCTV', 'UniFi and Hikvision'], door: ['Door station', 'Hikvision and Grandstream'], phone: ['IP telephone', 'Grandstream'], home: ['Home automation', ''], nas: ['Storage', 'Synology'], car: ['Car tracking', ''] },
    ar: { wifi: ['الواي فاي', 'UniFi'], network: ['الشبكات', 'UniFi'], fw: ['الجدار الناري', 'Netgate وUniFi'], cctv: ['كاميرات المراقبة', 'UniFi وHikvision'], door: ['محطة الباب', 'Hikvision وGrandstream'], phone: ['الهاتف عبر IP', 'Grandstream'], home: ['أتمتة المنازل', ''], nas: ['التخزين', 'Synology'], car: ['تتبع السيارات', ''] }
  };
  var T = {
    en: {
      dir: 'ltr', other: 'العربية', back: 'Back to website', theme: 'Switch between dark and light mode',
      h1: 'Request a quote', lead: 'Choose the systems you need, tell us how to reach you, and send the request to our team on WhatsApp.',
      s1: 'Choose systems', s2: 'Your details', s3: 'Send',
      pickH: '1. Choose your systems', pickP: 'Tap to add or remove. You can pick as many as you need.',
      detH: '2. Your details', detP: 'We use these to prepare your quote and get back to you.',
      sel: 'Selected', none: 'No systems selected yet.', rm: 'Remove',
      lblName: 'Name', lblPhone: 'Phone number', lblEmail: 'Email (optional)', lblNote: 'Project details (optional)',
      send: 'Send on WhatsApp', missing: 'To send, choose at least one system and enter your name and phone number.',
      fine: 'WhatsApp opens with your request filled in. Press send there to deliver it to us.',
      rights: 'Datum Technologies. All rights reserved.', waLabel: 'Chat on WhatsApp',
      wHello: 'Hello Datum, I would like a quote.', wName: 'Name', wPhone: 'Phone', wEmail: 'Email', wSystems: 'Systems', wDetails: 'Details', wFrom: 'Sent from the Datum website'
    },
    ar: {
      dir: 'rtl', other: 'English', back: 'العودة إلى الموقع', theme: 'التبديل بين الوضع الداكن والفاتح',
      h1: 'اطلب عرض سعر', lead: 'اختر الأنظمة التي تحتاجها، واكتب بيانات التواصل، ثم أرسل الطلب إلى فريقنا عبر واتساب.',
      s1: 'اختر الأنظمة', s2: 'بياناتك', s3: 'إرسال',
      pickH: '1. اختر أنظمتك', pickP: 'اضغط للإضافة أو الإزالة. يمكنك اختيار ما تحتاجه.',
      detH: '2. بياناتك', detP: 'نستخدمها لتجهيز عرض السعر والرد عليك.',
      sel: 'المختار', none: 'لم تختر أي نظام بعد.', rm: 'إزالة',
      lblName: 'الاسم', lblPhone: 'رقم الهاتف', lblEmail: 'البريد الإلكتروني (اختياري)', lblNote: 'تفاصيل المشروع (اختياري)',
      send: 'إرسال عبر واتساب', missing: 'للإرسال، اختر نظامًا واحدًا على الأقل واكتب اسمك ورقم هاتفك.',
      fine: 'سيفتح واتساب وفيه طلبك مكتوبًا. اضغط إرسال هناك ليصلنا.',
      rights: 'داتوم تكنولوجيز. جميع الحقوق محفوظة.', waLabel: 'تواصل عبر واتساب',
      wHello: 'مرحبًا داتوم، أرغب في الحصول على عرض سعر.', wName: 'الاسم', wPhone: 'الهاتف', wEmail: 'البريد الإلكتروني', wSystems: 'الأنظمة المطلوبة', wDetails: 'التفاصيل', wFrom: 'أُرسل من موقع داتوم'
    }
  };

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var NEEDS = {
    home: ['nas', 'fw', 'wifi', 'network'],
    wifi: ['network', 'fw'],
    cctv: ['fw', 'nas', 'wifi', 'network']
  };
  function withNeeds(id) {
    (NEEDS[id] || []).concat([id]).forEach(function (x) { if (sel.indexOf(x) < 0) sel.push(x); });
  }
  var sel = [];
  try { var a = JSON.parse(get('datum-quote') || '[]'); if (Array.isArray(a)) sel = a.filter(function (x) { return IDS.indexOf(x) >= 0; }); } catch (e) {}
  var q = new URLSearchParams(location.search);
  var add = q.get('add');
  if (add && IDS.indexOf(add) >= 0) withNeeds(add);
  if (q.toString()) history.replaceState(null, '', 'quote.html');
  function save() { put('datum-quote', JSON.stringify(sel)); }
  save();

  var lang = q.get('lang') === 'ar' || q.get('lang') === 'en' ? q.get('lang') : (get('datum-lang') === 'ar' ? 'ar' : 'en');
  var theme = get('datum-theme');
  if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  var f = { name: '', phone: '', email: '', note: '' };
  var app = document.getElementById('app');

  function render() {
    var L = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = L.dir;
    document.documentElement.setAttribute('data-theme', theme);
    var opts = IDS.map(function (id) {
      var n = N[lang][id];
      return '<button type="button" class="opt" data-id="' + id + '" aria-pressed="false"><span class="ck">' + CK + '</span><span class="ic">' + svg(id) + '</span><b>' + esc(n[0]) + '</b>' + (n[1] ? '<small dir="ltr" style="text-align:start">' + esc(n[1]) + '</small>' : '') + '</button>';
    }).join('');
    app.innerHTML =
      '<div class="qp"><div class="wrap">' +
      '<div class="top"><a class="back" href="index.html"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>' + esc(L.back) + '</a>' +
      '<div class="tools"><button type="button" class="ib" id="langBtn">' + esc(L.other) + '</button>' +
      '<button type="button" class="ib" id="themeBtn" aria-label="' + esc(L.theme) + '"><svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button></div></div>' +
      '<a href="index.html" class="logo" dir="ltr" style="text-decoration:none;color:var(--ink)"><span class="mk"><img src="assets/logo.png" alt="Datum"></span><span class="nm">Datum<small>Technologies</small></span></a>' +
      '<div class="ttl"><h1><span class="grad">' + esc(L.h1) + '</span></h1><p>' + esc(L.lead) + '</p>' +
      '<div class="stp"><span><b>1</b>' + esc(L.s1) + '</span><span><b>2</b>' + esc(L.s2) + '</span><span><b>3</b>' + esc(L.s3) + '</span></div></div>' +
      '<div class="lay"><div class="l"><div class="box"><h2>' + esc(L.pickH) + '</h2><p>' + esc(L.pickP) + '</p><div class="pick">' + opts + '</div></div></div>' +
      '<div class="r"><div class="box"><h2>' + esc(L.detH) + '</h2><p>' + esc(L.detP) + '</p>' +
      '<div class="sel" id="sel" aria-live="polite"></div>' +
      '<div class="form">' +
      '<div class="fld"><label for="q-name">' + esc(L.lblName) + '</label><input id="q-name" type="text" autocomplete="name"></div>' +
      '<div class="fld"><label for="q-phone">' + esc(L.lblPhone) + '</label><input id="q-phone" type="tel" dir="ltr" autocomplete="tel"></div>' +
      '<div class="fld"><label for="q-email">' + esc(L.lblEmail) + '</label><input id="q-email" type="email" dir="ltr" autocomplete="email"></div>' +
      '<div class="fld"><label for="q-note">' + esc(L.lblNote) + '</label><textarea id="q-note" rows="3"></textarea></div>' +
      '<a id="send" class="send" href="#" aria-disabled="true">' + esc(L.send) + '</a>' +
      '<p class="hint" id="missing">' + esc(L.missing) + '</p><p class="fine">' + esc(L.fine) + '</p></div></div></div></div></div></div>' +
      '<footer><div class="wrap"><span>' + esc(L.rights) + '</span><span><a href="index.html">datum.qa</a></span></div></footer>' +
      '<a class="wa" href="https://wa.me/' + WA + '" target="_blank" rel="noopener" aria-label="' + esc(L.waLabel) + '"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.1-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 .9-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg></a>';
    bind();
    update();
  }

  function toggle(id) {
    var i = sel.indexOf(id);
    if (i >= 0) sel.splice(i, 1); else withNeeds(id);
    save();
    update();
  }

  function update() {
    var L = T[lang];
    var ordered = IDS.filter(function (id) { return sel.indexOf(id) >= 0; });
    document.querySelectorAll('.opt').forEach(function (b) {
      b.setAttribute('aria-pressed', sel.indexOf(b.getAttribute('data-id')) >= 0 ? 'true' : 'false');
    });
    var box = document.getElementById('sel');
    box.innerHTML = ordered.length === 0 ? '<p class="none">' + esc(L.none) + '</p>' : ordered.map(function (id) {
      return '<button type="button" class="tag" data-rm="' + id + '" aria-label="' + esc(L.rm + ' ' + N[lang][id][0]) + '">' + esc(N[lang][id][0]) + '<i>×</i></button>';
    }).join('');
    var phoneOk = f.phone.replace(/[^0-9]/g, '').length >= 6;
    var can = ordered.length > 0 && f.name.trim() !== '' && phoneOk;
    var send = document.getElementById('send');
    var miss = document.getElementById('missing');
    if (can) {
      var lines = [L.wHello, '', L.wName + ': ' + f.name.trim(), L.wPhone + ': ' + f.phone.trim()];
      if (f.email.trim()) lines.push(L.wEmail + ': ' + f.email.trim());
      lines.push(L.wSystems + ':');
      ordered.forEach(function (id) { lines.push('- ' + N[lang][id][0]); });
      if (f.note.trim()) lines.push(L.wDetails + ': ' + f.note.trim());
      lines.push('', L.wFrom);
      send.href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(lines.join('\n'));
      send.target = '_blank';
      send.rel = 'noopener';
      send.className = 'send ready';
      send.setAttribute('aria-disabled', 'false');
      miss.className = 'hint';
    } else {
      send.href = '#';
      send.removeAttribute('target');
      send.className = 'send';
      send.setAttribute('aria-disabled', 'true');
    }
  }

  function bind() {
    document.getElementById('langBtn').addEventListener('click', function () {
      lang = lang === 'en' ? 'ar' : 'en';
      put('datum-lang', lang);
      render();
    });
    document.getElementById('themeBtn').addEventListener('click', function () {
      theme = theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      put('datum-theme', theme);
    });
    document.querySelectorAll('.opt').forEach(function (b) {
      b.addEventListener('click', function () { toggle(b.getAttribute('data-id')); });
    });
    document.getElementById('sel').addEventListener('click', function (e) {
      var t = e.target.closest && e.target.closest('[data-rm]');
      if (t) toggle(t.getAttribute('data-rm'));
    });
    var map = { 'q-name': 'name', 'q-phone': 'phone', 'q-email': 'email', 'q-note': 'note' };
    Object.keys(map).forEach(function (id) {
      var el = document.getElementById(id);
      el.value = f[map[id]];
      el.addEventListener('input', function () { f[map[id]] = el.value; update(); });
    });
    document.getElementById('send').addEventListener('click', function (e) {
      if (this.getAttribute('aria-disabled') === 'true') {
        e.preventDefault();
        document.getElementById('missing').className = 'hint on';
        if (!f.name.trim()) document.getElementById('q-name').focus();
        else if (f.phone.replace(/[^0-9]/g, '').length < 6) document.getElementById('q-phone').focus();
      }
    });
  }
  render();
})();
</script>
</body>
</html>
